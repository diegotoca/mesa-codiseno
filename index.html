<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mesa de co-diseño</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>

/* Concepto: mesa de trabajo en dos tiempos. Cada paso es una tarjeta que se abre; al publicar, el muro del grupo se desbloquea debajo. */
:root{
  --bg:#EDF1ED; --surface:#FFFFFF; --surface2:#F4F7F4; --ink:#12231E; --muted:#51635C; --line:#D2DBD5;
  --accent:#0B6B5B; --accent-ink:#FFFFFF; --accent-soft:#D6EDE6;
  --sun:#B97B0A; --sun-soft:#FBEED0;
  --ok:#23704A; --ok-soft:#DAF0E3; --warn:#9A4D08; --warn-soft:#FBE7D0; --bad:#B42318; --bad-soft:#FBE0DC;
  --dot-l:42%;
  --c-dato:#2B6CA3; --c-indicador:#2F8450; --c-mapa:#9A6A12; --c-alerta:#C0392B; --c-actor:#7A58A8;
  --c-decision:#0E7C86; --c-plazo:#566B82; --c-territorio:#85563A; --c-pregunta:#B0447A; --c-blanco:#66716C;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1715; --surface:#14221F; --surface2:#1A2B27; --ink:#E5EEEA; --muted:#9BAFA8; --line:#2A3D37;
    --accent:#4DC4A9; --accent-ink:#04201A; --accent-soft:#17352E;
    --sun:#F0B33A; --sun-soft:#3A2F12;
    --ok:#62C98B; --ok-soft:#173326; --warn:#F2A650; --warn-soft:#3A2813; --bad:#F27F72; --bad-soft:#3C1B17;
    --dot-l:62%;
    --c-dato:#74B1E3; --c-indicador:#6FCB8D; --c-mapa:#E2B35C; --c-alerta:#F28E80; --c-actor:#B79EE3;
    --c-decision:#58C6CF; --c-plazo:#9FB3CA; --c-territorio:#D49E7C; --c-pregunta:#E584B4; --c-blanco:#A7B3AE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#14221F; --surface2:#1A2B27; --ink:#E5EEEA; --muted:#9BAFA8; --line:#2A3D37;
  --accent:#4DC4A9; --accent-ink:#04201A; --accent-soft:#17352E;
  --sun:#F0B33A; --sun-soft:#3A2F12;
  --ok:#62C98B; --ok-soft:#173326; --warn:#F2A650; --warn-soft:#3A2813; --bad:#F27F72; --bad-soft:#3C1B17;
  --dot-l:62%;
  --c-dato:#74B1E3; --c-indicador:#6FCB8D; --c-mapa:#E2B35C; --c-alerta:#F28E80; --c-actor:#B79EE3;
  --c-decision:#58C6CF; --c-plazo:#9FB3CA; --c-territorio:#D49E7C; --c-pregunta:#E584B4; --c-blanco:#A7B3AE;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,h5{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.marca{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.marca svg{display:block}
.brand b{display:block;font-family:var(--font-display);font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.8rem;max-width:44ch}
.quien{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

.ventana{margin-top:16px;border-radius:var(--r);padding:10px 14px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface)}
.ventana .pt{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-top:.5em}
.ventana.abierta{background:var(--ok-soft);border-color:transparent}.ventana.abierta .pt{background:var(--ok)}
.ventana.antes{background:var(--sun-soft);border-color:transparent}.ventana.antes .pt{background:var(--sun)}
.ventana.cerrada{background:var(--bad-soft);border-color:transparent}.ventana.cerrada .pt{background:var(--bad)}
.aviso{margin-top:12px;border-radius:var(--r);padding:10px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent;font-size:.95rem}

.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

main{margin-top:24px;display:block}
.pagina{display:grid;gap:20px}

/* secciones */
.titulo-pag h2{font-size:clamp(1.5rem,4.4vw,2.2rem);font-weight:800;letter-spacing:-.015em}
.titulo-pag p{margin-top:8px;color:var(--muted);max-width:62ch}
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.bloque h3{font-size:1.15rem;margin-bottom:10px}
.bloque p+p{margin-top:8px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.lista-simple{margin:0;padding-left:1.2em;display:grid;gap:6px}
.nota{color:var(--muted);font-size:.9rem}
.vacio{color:var(--muted);font-size:.95rem;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;cursor:pointer;font-weight:700;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px}
.chip .tu{font-weight:400;color:var(--muted);font-size:.8rem}
.dot{width:.75rem;height:.75rem;border-radius:50%;flex:none;background:hsl(var(--h,0) var(--ds,62%) var(--dot-l))}

/* seudónimos */
.semillas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-block:12px}
.semilla{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:700}
.semilla[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.semilla:disabled{opacity:.5;cursor:not-allowed}
.semilla small{display:block;font-weight:400;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;margin-block:10px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}

/* pasos */
.actividad{display:grid;gap:12px}
.paso{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.paso-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.paso-head:hover{background:var(--surface2)}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.paso-t{flex:1;min-width:0;display:grid;gap:2px}
.paso-titulo{font-family:var(--font-display);font-weight:800;font-size:1.1rem;line-height:1.2}
.paso-meta{color:var(--muted);font-size:.85rem}
.estado{flex:none;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.estado.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.estado.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.paso-cuerpo{padding:4px 16px 18px;display:grid;gap:14px;border-top:1px solid var(--line)}
.pregunta{font-size:1.05rem;font-weight:700;margin-top:12px}
.ayuda{color:var(--muted);font-size:.92rem;margin-top:-6px}
fieldset.campos{border:0;margin:0;padding:0;min-width:0;display:grid;gap:14px}
fieldset.campos:disabled{opacity:.7}
.campo{display:grid;gap:5px}
.campo label,.campo .et{font-weight:700;font-size:.95rem}
textarea,input[type="text"],input[type="datetime-local"],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);min-height:42px}
textarea{resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.contador{font-size:.8rem;color:var(--muted);text-align:right}
.acciones{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.opciones{display:flex;gap:8px;flex-wrap:wrap}
.opcion{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface);font-weight:700}
.opcion input{accent-color:var(--accent)}
.opcion:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}

/* selector de material */
.sel-tabs{display:flex;gap:6px;flex-wrap:wrap}
.sel-tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.sel-tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel-tab .ok{color:var(--ok);margin-left:4px}
.sel-tab[aria-pressed="true"] .ok{color:inherit}
.mat{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);align-items:start}
.mat:not(:has(img)){grid-template-columns:minmax(0,1fr)}
.mat h5{font-size:1.05rem;margin-bottom:4px}
.mat .btn{margin-top:8px}
@media (max-width:560px){.mat{grid-template-columns:minmax(0,1fr)}}
.foto{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.img-sel{display:grid;gap:8px;justify-items:start}
.img-sel .foto{max-width:360px}

/* cartas y hoja */
.t-dato{--tc:var(--c-dato)}.t-indicador{--tc:var(--c-indicador)}.t-mapa{--tc:var(--c-mapa)}.t-alerta{--tc:var(--c-alerta)}
.t-actor{--tc:var(--c-actor)}.t-decision{--tc:var(--c-decision)}.t-plazo{--tc:var(--c-plazo)}.t-territorio{--tc:var(--c-territorio)}
.t-pregunta{--tc:var(--c-pregunta)}.t-blanco{--tc:var(--c-blanco)}
.paleta{display:flex;flex-wrap:wrap;gap:6px}
.tipo-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--tc);background:var(--surface);color:var(--tc);cursor:pointer;font-weight:700;font-size:.9rem}
.tipo-btn:hover:not(:disabled){background:var(--tc);color:var(--surface)}
.hoja-editor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
@media (max-width:780px){.hoja-editor{grid-template-columns:minmax(0,1fr)}}
.cartas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.carta-ed{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.carta-ed.arrastrando{opacity:.5}
.carta-ed.sobre{border-color:var(--accent)}
.asa{cursor:grab;color:var(--muted);padding:4px;line-height:0;user-select:none}
.carta-ed .tag{grid-column:2}
.carta-ed input{min-height:38px}
.mini-btns{display:flex;gap:2px}
.mini-btns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;cursor:pointer;line-height:1}
.mini-btns button:disabled{opacity:.35;cursor:default}
.tag,.carta-tag{display:inline-flex;align-items:center;gap:6px;color:var(--tc);font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.ico{display:inline-flex;line-height:0}
.hoja{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;box-shadow:0 8px 20px -14px rgba(0,0,0,.45)}
.hoja-cartas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.carta{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;background:var(--surface);background:color-mix(in srgb,var(--tc) 7%,var(--surface));min-width:0}
.carta.primera{grid-column:1/-1;padding:12px 14px;border-color:var(--tc)}
.carta.primera .carta-texto{font-family:var(--font-display);font-size:1.15rem;font-weight:600;line-height:1.25}
.carta-texto{overflow-wrap:anywhere;font-size:.95rem}
.primero{margin-left:auto;background:var(--tc);color:var(--surface);border-radius:999px;padding:0 8px;font-size:.68rem;letter-spacing:.05em}

/* muro */
.muro{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.muro-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muro-t h4{font-size:1.02rem}
.n{font-family:var(--font-display);font-weight:800;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 9px;font-size:.85rem}
.candado{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line)}
.muro-lista{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.aporte{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--surface);min-width:0}
.aporte.mio{border-color:var(--accent)}
.aporte>.chip{justify-self:start;max-width:100%}
.aporte-texto{overflow-wrap:anywhere}
.parte b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.parte span{overflow-wrap:anywhere}
.frase-r strong{background:var(--sun-soft);padding:0 4px;border-radius:4px;font-weight:700}
.coms{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.com{font-size:.92rem;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.com span.tx{overflow-wrap:anywhere}
.com-ed{display:grid;gap:6px}
.barras{display:grid;gap:6px}
.barra{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) minmax(0,12em);gap:10px;align-items:center;font-size:.92rem}
.barra .pista{height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.barra .relleno{display:block;height:100%;background:var(--tc,var(--accent));border-radius:6px}
.barra .et{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.barra .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
@media (max-width:520px){.barra{grid-template-columns:minmax(0,1fr) auto}.barra .pista{grid-column:1/-1;order:3}.barra .val{text-align:right}}
.cols3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.cols3 h5{font-size:.95rem;margin-bottom:8px}
.chips-w{display:flex;flex-wrap:wrap;gap:6px}
.etq{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:.92rem;overflow-wrap:anywhere}
.etq i{font-style:normal;font-weight:800;color:var(--accent)}
.grupo-mat{display:grid;gap:10px}
.grupo-mat>h5{font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:4px}

/* avance */
.avance{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.avance li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.avance li:last-child{border-bottom:0}
.avance .t{display:flex;gap:10px;align-items:center;min-width:0}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.c,th.c{text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center}
.cargando{padding:40px 0;text-align:center;color:var(--muted)}
.form-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
@media (prefers-reduced-motion: no-preference){.paso{transition:border-color .15s}.paso:hover{border-color:var(--accent)}}


/* base para página independiente */
html{color-scheme:light}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]){color-scheme:dark}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.puerta{max-width:520px;margin-inline:auto;display:grid;gap:12px}
.puerta h2{font-size:1.5rem;font-weight:800}
.clave-caja{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.14em;font-weight:700;background:var(--surface2);border:1px dashed var(--accent);border-radius:10px;padding:12px 16px;text-align:center;user-select:all;overflow-wrap:anywhere}
.clave-aviso{border-color:var(--accent);display:grid;gap:10px}
.clave-aviso h3,.clave-aviso p{margin:0}
.foto:not([src]){min-height:80px}
.form-mat{display:grid;gap:12px;margin-block:12px}
.lista-mat{display:grid;gap:12px}
.fila-mat{display:grid;gap:10px;background:var(--surface2)}
.img-sel label.btn{cursor:pointer}
.pagina{grid-template-columns:minmax(0,1fr)}
@media (max-width:520px){.carta-ed{grid-template-columns:auto minmax(0,1fr)}.carta-ed .mini-btns{grid-column:2;justify-content:flex-end}}
.col-ed{display:grid;gap:14px;min-width:0;align-content:start}
.col-vista{min-width:0}
.et-v{font-weight:700;font-size:.95rem;margin-bottom:6px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="marca" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke:var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M4 12h16M4 17h7"/></svg></div>
      <div><b>Mesa de co-diseño</b><small>Observatorio de Salud Mental, Familia y Convivencia Social de la Orinoquía</small></div>
    </div>
    <div class="quien" id="quien" hidden></div>
  </header>
  <div id="ventana" class="ventana" role="status" hidden></div>
  <div id="avisos" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Secciones" hidden></nav>
  <main id="main"><p class="cargando">Abriendo la mesa de trabajo…</p></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ================= configuración ================= */
// Pegue aquí los dos datos de su proyecto de Supabase (Project Settings > API).

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k==='html') el.innerHTML=v;
    else if(k==='value') el.value=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}

function configurado(){return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CONFIG.url)&&CONFIG.key&&CONFIG.key.indexOf('SU-')!==0;}
async function rpc(fn,args){
  const headers={'Content-Type':'application/json',apikey:CONFIG.key};
  if(CONFIG.key.indexOf('eyJ')===0)headers.Authorization='Bearer '+CONFIG.key;
  let r;
  try{r=await fetch(CONFIG.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:headers,body:JSON.stringify(args||{})});}
  catch(e){throw{code:'red',message:'sin conexión'};}
  const txt=await r.text();let j=null,valido=true;try{j=txt?JSON.parse(txt):null;}catch(e){valido=false;}
  if(!r.ok){throw{code:(j&&j.message)||('http_'+r.status),status:r.status};}
  return valido?j:txt;
}

/* normalización y comparación */
function vacio(step){
  switch(step.id){
   case 'mat':case 'est':return{items:{}};
   case 'hoja':return{cartas:[],foto:'',porque:''};
   case 'frase':return{persona:'',necesita:'',decidir:'',voto:'',votoOtro:''};
   case 'caso':return{sabiamos:'',necesitaba:'',perdio:'',img:''};
   case 'act':return{deciden:'',aportan:'',ven:''};
   default:return{texto:''};
  }
}
function normalizar(step,r){
  r=r||{};
  switch(step.id){
   case 'def':return{texto:T(r.texto,300)};
   case 'caso':return{sabiamos:T(r.sabiamos,300),necesitaba:T(r.necesitaba,300),perdio:T(r.perdio,300),img:T(r.img,64)};
   case 'frase':return{persona:T(r.persona,160),necesita:T(r.necesita,200),decidir:T(r.decidir,200),voto:['morbilidad','mortalidad','otro'].indexOf(r.voto)>=0?r.voto:'',votoOtro:r.voto==='otro'?T(r.votoOtro,120):''};
   case 'act':return{deciden:T(r.deciden,400),aportan:T(r.aportan,400),ven:T(r.ven,400)};
   case 'mat':case 'est':{
     const ks=step.campos.map(c=>c.k),out={},it=r.items||{};
     Object.keys(it).sort().forEach(id=>{const o={};let any=false;ks.forEach(k=>{o[k]=T(it[id]&&it[id][k],300);if(o[k])any=true;});if(any)out[id]=o;});
     return{items:out};}
   case 'hoja':return{cartas:(r.cartas||[]).slice(0,8).map(c=>({tipo:TIPO_IDS.indexOf(c.tipo)>=0?c.tipo:'blanco',texto:T(c.texto,160)})).filter(c=>c.texto),foto:T(r.foto,64),porque:T(r.porque,300)};
  }
}
function llena(step,c){
  switch(step.id){
   case 'def':return !!c.texto;
   case 'caso':return !!(c.sabiamos||c.necesitaba||c.perdio);
   case 'frase':return !!(c.persona||c.necesita||c.decidir||c.voto);
   case 'act':return !!(c.deciden||c.aportan||c.ven);
   case 'mat':case 'est':return Object.keys(c.items).length>0;
   case 'hoja':return c.cartas.length>0||!!c.foto;
  }
  return false;
}
function sinT(c){const o=Object.assign({},c);delete o.t;return o;}
function estadoPaso(step){
  const pub=S.me&&S.me.pasos&&S.me.pasos[step.id];
  const cur=normalizar(step,D[step.id]);
  const lleno=llena(step,cur);
  if(!pub)return lleno?'listo':'vacio';
  if(JSON.stringify(normalizar(step,sinT(pub)))===JSON.stringify(cur))return 'publicado';
  return lleno?'cambios':'publicado';
}

function aDataUrl(blob){return new Promise((ok,mal)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>mal(f.error);f.readAsDataURL(blob);});}
async function reducir(file){
  const bmp=await createImageBitmap(file);
  for(const [max,q] of [[1200,0.78],[1000,0.65],[800,0.55],[600,0.5]]){
    const esc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*esc)),hh=Math.max(1,Math.round(bmp.height*esc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(bmp,0,0,w,hh);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
    if(blob&&blob.size>0&&blob.size<450000)return aDataUrl(blob);
  }
  throw{code:'grande'};
}
async function subirImagen(file){
  const data=await reducir(file);
  const id=await rpc('mesa_subir_imagen',{p_codigo:S.codigo,p_seudonimo:S.sesion.seudonimo,p_clave:S.sesion.clave,p_data:data});
  IMG.set(id,Promise.resolve(data));return id;
}
async function subirImagenAdmin(file){
  const data=await reducir(file);

}

}
function selectorImagen(getId,setId,etiqueta,idBase,onCambio,subir){
  subir=subir||subirImagen;
  const wrap=h('div',{class:'img-sel'});
  const estado=h('span',{class:'nota'});
  const input=h('input',{type:'file',accept:'image/*',id:idBase,class:'oculto'});
  input.addEventListener('change',async()=>{
    const f=input.files&&input.files[0];if(!f)return;
    estado.textContent='Subiendo…';
    try{const id=await subir(f);setId(id);input.value='';pintar();if(onCambio)onCambio();}
    catch(e){estado.textContent=msgSubida(e);input.value='';}
  });
  function pintar(){
    wrap.replaceChildren();
    estado.textContent='';
    const id=getId();
    if(id){
      wrap.append(imagen(id,etiqueta),h('button',{type:'button',class:'btn ghost sm',onClick:()=>{setId('');pintar();if(onCambio)onCambio();}},'Quitar imagen'));
    }else{
      wrap.append(h('label',{class:'btn ghost sm',for:idBase},etiqueta),input,estado);
    }
  }
  pintar();
  wrap.repintar=pintar;
  return wrap;
}

function textoPaso(step,c){

   case 'frase':L.push('Una persona de '+c.persona+' necesita '+c.necesita+' para decidir '+c.decidir+'.','Tema: '+(c.voto||'sin elegir')+(c.votoOtro?' ('+c.votoOtro+')':''));break;
   case 'act':L.push('Quién decide: '+c.deciden,'Quién aporta datos: '+c.aportan,'Quién ve lo que los datos no ven: '+c.ven);break;
   case 'mat':case 'est':Object.keys(c.items).forEach(id=>{const m=S.materiales.find(q=>q.id===id);L.push((m?m.titulo:id)+':');step.campos.forEach(f=>{if(c.items[id][f.k])L.push('  '+f.label+': '+c.items[id][f.k]);});});break;

function aplanar(doc){
  const filas=[];
  PASOS.forEach(s=>{
    const c=doc.pasos&&doc.pasos[s.id];if(!c)return;
    const add=(campo,texto)=>{if(texto!==''&&texto!=null)filas.push([s.titulo,campo,texto]);};
    switch(s.id){
     case 'def':add('Texto',c.texto);break;
     case 'caso':add('Lo que sabíamos',c.sabiamos);add('Lo que se necesitaba',c.necesitaba);add('Lo que se perdió, o lo que sí llegó',c.perdio);if(c.img)add('Imagen',c.img);break;
     case 'frase':add('Una persona de',c.persona);add('Necesita',c.necesita);add('Para decidir',c.decidir);add('Tema',c.voto==='otro'?('otro'+(c.votoOtro?': '+c.votoOtro:'')):c.voto);break;
     case 'act':add('Quién decide',c.deciden);add('Quién aporta datos',c.aportan);add('Quién ve lo que los datos no ven',c.ven);break;
     case 'mat':case 'est':Object.keys(c.items||{}).forEach(id=>{const m=S.materiales.find(q=>q.id===id);const t=m?m.titulo:id;s.campos.forEach(f=>add(t+' · '+f.label,c.items[id][f.k]));});break;
     case 'hoja':(c.cartas||[]).forEach((k,i)=>add('Carta '+(i+1)+' ('+(TIPO[k.tipo]||TIPO.blanco).nombre+')',k.texto));add('Por qué primero',c.porque);if(c.foto)add('Foto',c.foto);break;
    }
  });
  Object.keys(doc.comentarios||{}).forEach(k=>{const p=k.split('__');const t=doc.comentarios[k];if(t&&t.texto)filas.push(['Comentario',(PASO[p[1]]?PASO[p[1]].titulo:p[1])+' · para '+p[0],t.texto]);});
  return filas;
}
function aCSV(){
  const esc=v=>'"'+String(v).replace(/"/g,'""').replace(/\r?\n/g,' ⏎ ')+'"';
  const lineas=[['seudonimo','paso','campo','texto'].map(esc).join(',')];
  todos().forEach(x=>aplanar(x.d).forEach(f=>lineas.push([x.d.seudonimo,f[0],f[1],f[2]].map(esc).join(','))));
  return '﻿'+lineas.join('\r\n');
}

  const fTitulo=h('input',{type:'text',id:'f-mat-titulo',maxlength:90,placeholder:'p. ej., Tablero de indicadores'});
  const fDesc=h('textarea',{id:'f-mat-desc',rows:2,maxlength:300,placeholder:'Una o dos frases sobre qué es'});
  const fEnlace=h('input',{type:'text',id:'f-mat-enlace',maxlength:300,placeholder:'https://… (opcional)'});
  const fTipo=h('select',{id:'f-mat-tipo'},h('option',{value:'material',text:'Material del observatorio (Actividad 1)'}),h('option',{value:'estimulo',text:'Ejemplo de otro contexto (Actividad 2)'}));
  fTipo.addEventListener('change',()=>{nuevo.tipo=fTipo.value;});
  const sel=selectorImagen(()=>nuevo.imagen,v=>{nuevo.imagen=v;},'Subir imagen','f-mat-imagen',null,subirImagenAdmin);
  const listaMat=h('div',{class:'lista-mat'});
  PAGES._listaMat=listaMat;
  root.append(h('div',{class:'bloque'},h('h3',{text:'Materiales y ejemplos'}),
    h('p',{class:'nota',text:'Los materiales aparecen en el paso «Revisar un material» y los ejemplos en «Dos ejemplos de otros contextos». Use dos ejemplos muy distintos entre sí.'}),
    h('div',{class:'form-mat'},
      h('div',{class:'campo'},h('label',{for:'f-mat-tipo',text:'Tipo'}),fTipo),
      h('div',{class:'campo'},h('label',{for:'f-mat-titulo',text:'Título'}),fTitulo),
      h('div',{class:'campo'},h('label',{for:'f-mat-desc',text:'Descripción'}),fDesc),
      h('div',{class:'campo'},h('label',{for:'f-mat-enlace',text:'Enlace'}),fEnlace),
      h('div',{class:'campo'},h('span',{class:'et',text:'Imagen (captura del material o del ejemplo)'}),sel),
      h('div',{class:'acciones'},h('button',{type:'button',class:'btn primary',onClick:async()=>{
        const titulo=T(fTitulo.value,90);if(!titulo){msgM.textContent='Escriba un título.';return;}
        const enlace=T(fEnlace.value,300);if(enlace&&!/^https:\/\//i.test(enlace)){msgM.textContent='El enlace debe empezar por https://';return;}
        try{
          await adm('agregar_material',{tipo:nuevo.tipo,titulo:titulo,descripcion:T(fDesc.value,300),enlace:enlace,imagen:nuevo.imagen||''});
          fTitulo.value='';fDesc.value='';fEnlace.value='';nuevo.imagen='';sel.repintar();msgM.textContent='Agregado.';sondear();
        }catch(e){msgM.textContent='No se pudo agregar.';}
      }},'Agregar'),msgM)),
    listaMat));

  PAGES._seguimiento=h('div',{class:'tabla'});
  root.append(h('div',{class:'bloque'},h('h3',{text:'Seguimiento'}),h('p',{class:'nota',text:'Qué publicó cada seudónimo. Los borradores no se ven.'}),PAGES._seguimiento));

  const msgE=h('p',{class:'nota'});
  root.append(h('div',{class:'bloque'},h('h3',{text:'Exportar'}),
    h('p',{class:'nota',text:'El JSON trae todo: ventana, materiales, aportes e imágenes. El CSV trae una fila por campo, listo para abrir en Excel.'}),
    h('div',{class:'acciones',style:'margin-top:10px'},
      h('button',{type:'button',class:'btn primary',onClick:async()=>{
        msgE.textContent='Preparando…';
        try{const d=await adm('exportar');descargar('mesa-codiseno-datos.json',JSON.stringify(d,null,2),'application/json');msgE.textContent='Archivo descargado.';}
        catch(e){msgE.textContent='No se pudo exportar.';}
      }},'Descargar todo (JSON)'),
      h('button',{type:'button',class:'btn ghost',onClick:()=>{descargar('mesa-codiseno-aportes.csv',aCSV(),'text/csv;charset=utf-8');msgE.textContent='Archivo descargado.';}},'Descargar tabla (CSV)')),msgE));
}
function pintarPanel(){
  if(!S.owner||!PAGES._listaMat)return;
  const [a,c]=PAGES._ventanaInputs;
  if(!UI.panelSucio&&document.activeElement!==a&&document.activeElement!==c){a.value=aInput(S.ventana&&S.ventana.abre);c.value=aInput(S.ventana&&S.ventana.cierra);}
  const lm=PAGES._listaMat;lm.replaceChildren();
  if(!S.materiales.length)lm.append(h('p',{class:'vacio',text:'Todavía no hay materiales ni ejemplos.'}));
  S.materiales.forEach(m=>{
    let pend=UI.pendQuitar===m.id;
    const fila=h('div',{class:'bloque fila-mat'},
      h('p',{class:'nota',text:m.tipo==='material'?'Material (Actividad 1)':'Ejemplo (Actividad 2)'}),tarjetaMaterial(m));
    const bar=h('div',{class:'acciones'});
    const pintaBar=()=>{bar.replaceChildren(...(pend
      ?[h('span',{text:'¿Quitar de la lista? Los aportes que lo mencionan se conservan.'}),h('button',{type:'button',class:'btn danger sm',onClick:async()=>{try{await adm('quitar_material',{id:m.id});UI.pendQuitar=null;sondear();}catch(e){toast('No se pudo quitar.');}}},'Sí, quitar'),h('button',{type:'button',class:'btn ghost sm',onClick:()=>{pend=false;UI.pendQuitar=null;pintaBar();}},'No')]
      :[h('button',{type:'button',class:'btn ghost sm',onClick:()=>{pend=true;UI.pendQuitar=m.id;pintaBar();}},'Quitar')]));};
    pintaBar();fila.append(bar);lm.append(fila);
  });
  const filas=todos();
  const cont=PAGES._seguimiento;cont.replaceChildren();
  if(!filas.length){cont.append(h('p',{class:'vacio',text:'Todavía no hay participantes con seudónimo.'}));return;}
  const tabla=h('table',null,
    h('thead',null,h('tr',null,h('th',{text:'Seudónimo'}),PASOS.map(p=>h('th',{class:'c',title:p.titulo,text:p.act+'.'+(PASOS.filter(q=>q.act===p.act).indexOf(p)+1)})),h('th',{class:'c',text:'Comentarios'}),h('th',{text:'Última actividad'}),h('th',{text:''}))),
    h('tbody',null,filas.map(x=>{
      const nc=Object.keys(x.d.comentarios||{}).length;
      const celda=h('td');let pend=UI.pendRetiro===x.d.seudonimo;
      const pintaC=()=>{celda.replaceChildren(...(pend
        ?[h('button',{type:'button',class:'btn danger sm',onClick:async()=>{try{await adm('borrar_participante',{seudonimo:x.d.seudonimo});UI.pendRetiro=null;sondear();}catch(e){toast('No se pudo retirar.');}}},'Confirmar retiro'),' ',h('button',{type:'button',class:'btn ghost sm',onClick:()=>{pend=false;UI.pendRetiro=null;pintaC();}},'No')]
        :[h('button',{type:'button',class:'btn ghost sm',onClick:()=>{pend=true;UI.pendRetiro=x.d.seudonimo;pintaC();}},'Retirar')]));};
      pintaC();
      return h('tr',null,h('td',null,chip(x.d.seudonimo,false)),PASOS.map(p=>h('td',{class:'c',text:x.d.pasos&&x.d.pasos[p.id]?'✓':'·'})),h('td',{class:'c',text:String(nc)}),h('td',{text:x.d.actualizado?fmtCorta.format(new Date(x.d.actualizado)):'—'}),celda);
    })));
  cont.append(tabla,h('p',{class:'nota',style:'margin-top:8px',text:'Columnas: actividad.paso, en el orden de cada actividad. «Retirar» borra todos los aportes de esa persona.'}));
}

/* ================= ciclo ================= */
function actualizarTodo(){
  if(!S.listo)return;
  pintarArriba();
  pintarTabs();
  pintarInicioSeguro();
  PASOS.forEach(p=>{pintarBoton(p);pintarMuro(p);});
  pintarPanel();
}
function aplicarLectura(r){
  const huella=JSON.stringify([r.rol,r.ventana,r.materiales,r.aportes]);
  S.offset=(r.ahora||Date.now())-Date.now();
  if(huella===S.ultima)return false;
  S.ultima=huella;
  S.owner=r.rol==='admin';
  S.ventana=r.ventana||null;
  S.materiales=(r.materiales||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
  const m=new Map();(r.aportes||[]).forEach(a=>m.set(a.seudonimo,a.doc));S.docs=m;
  return true;
}
async function sondear(){
  if(!S.listo||!S.codigo)return;
  if(document.visibilityState==='hidden')return;
  try{
    const r=await rpc('mesa_leer',{p_codigo:S.codigo});
    const hab=S.sinRed;S.sinRed=false;
    const cambio=aplicarLectura(r);
    if(cambio){['mat','est'].forEach(k=>{if(ELS[k]&&ELS[k].repintar)ELS[k].repintar();});actualizarTodo();}
    else if(hab)pintarArriba();
    if(S.sesion&&!S.docs.has(S.sesion.seudonimo)){toast('Su seudónimo fue retirado. Elija uno nuevo.');cerrarSesion();}
  }catch(e){
    if(e&&e.code==='codigo'){toast('El código del grupo cambió. Vuelva a escribirlo.');olvidarCodigo();return;}
    S.sinRed=true;pintarArriba();
  }
}

/* ================= arranque ================= */
function armarPaginas(){
  const main=document.getElementById('main');
  main.replaceChildren(h('div',{'data-page':'inicio',class:'pagina'}),h('div',{'data-page':'a1',class:'pagina',hidden:true}),h('div',{'data-page':'a2',class:'pagina',hidden:true}),h('div',{'data-page':'panel',class:'pagina',hidden:true}));
  PAGES.inicio=main.children[0];PAGES.a1=main.children[1];PAGES.a2=main.children[2];PAGES.panel=main.children[3];
}
function chrome(visible){
  ['tabs','ventana','avisos'].forEach(id=>{document.getElementById(id).hidden=!visible;});
  document.getElementById('quien').hidden=!visible;
}
function mostrarError(titulo,texto,reintentar){
  chrome(false);
  document.getElementById('main').replaceChildren(h('div',{class:'bloque puerta'},h('h2',{text:titulo}),h('p',{text:texto}),
    reintentar?h('div',{class:'acciones'},h('button',{type:'button',class:'btn primary',onClick:reintentar},'Intentar de nuevo')):null));
}
function mostrarPuerta(aviso){
  chrome(false);
  const inp=h('input',{type:'text',id:'f-codigo',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'Código que recibió con el enlace'});
  const msg=h('p',{class:'nota',text:aviso||''});
  const ir=async()=>{
    const cod=T(inp.value,80);if(!cod){msg.textContent='Escriba el código.';return;}
    msg.textContent='Comprobando…';
    await entrarMesa(cod,null,m=>{msg.textContent=m;});
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')ir();});
  document.getElementById('main').replaceChildren(h('div',{class:'bloque puerta'},
    h('h2',{text:'Entre a la mesa'}),
    h('p',{text:'Escriba el código del grupo. Lo recibió junto con el enlace de esta página.'}),
    h('div',{class:'campo'},h('label',{for:'f-codigo',text:'Código'}),inp),
    h('div',{class:'acciones'},h('button',{type:'button',class:'btn primary',onClick:ir},'Entrar')),msg,
    h('p',{class:'nota',text:'Si es el investigador, escriba su código de investigador.'})));
  inp.focus();
}
async function entrarMesa(codigo,ses,avisar){
  let r;
  try{r=await rpc('mesa_leer',{p_codigo:codigo});}
  catch(e){
    if(e&&e.code==='codigo'){lsDel('mesa-codigo');S.codigo='';if(avisar)avisar('Ese código no es correcto.');else mostrarPuerta('El código guardado ya no es válido. Escriba el código de nuevo.');return;}
    if(e&&e.code==='sin_configurar'){mostrarError('La mesa aún no está lista','El investigador todavía no termina de configurarla. Vuelva a intentarlo más tarde.');return;}
    if(avisar)avisar('No se pudo conectar. Revise su conexión e intente de nuevo.');else mostrarError('Sin conexión','No se pudo conectar con el servidor.',()=>arrancar());
    return;
  }
  S.codigo=codigo;lsSet('mesa-codigo',codigo);
  S.ultima='';aplicarLectura(r);
  S.sesion=null;S.uid=null;S.me=null;
  if(ses&&ses.seudonimo&&ses.clave){
    const doc=S.docs.get(ses.seudonimo);
    if(doc&&doc.seudonimo){S.sesion={seudonimo:ses.seudonimo,clave:ses.clave};S.uid=ses.seudonimo;S.me=clone(doc);S.me.pasos=S.me.pasos||{};S.me.comentarios=S.me.comentarios||{};}
    else lsDel('mesa-sesion');
  }
  armarPaginas();chrome(true);
  iniciarBorradores();construirActividades();
  if(S.owner)construirPanel();
  S.listo=true;
  irA('inicio');
  actualizarTodo();
  clearInterval(sondeoT);
  sondeoT=setInterval(sondear,15000);
}
function arrancar(){
  document.getElementById('main').replaceChildren(h('p',{class:'cargando',text:'Abriendo la mesa de trabajo…'}));
  if(!configurado()){mostrarError('Falta configurar la página','Abra index.html y pegue la dirección y la clave pública de Supabase en el bloque CONFIG, al principio del script.');return;}
  const cod=lsGet('mesa-codigo')||'';
  if(!cod){mostrarPuerta('');return;}
  return entrarMesa(cod,parse(lsGet('mesa-sesion')),null);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sondear();});
setInterval(()=>{if(S.listo)pintarArriba();},30000);
arrancar();
})();

</script>
